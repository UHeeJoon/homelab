# networking/routes/argo-workflows-httproute.yaml
# Argo Workflows UI 를 admin-gateway 로 노출 (client 인증: SA 토큰 필요).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows-route
  namespace: argo
spec:
  parentRefs:
    - name: admin-gateway
      namespace: ingress
  hostnames:
    - workflows.ascode.click
  rules:
    - backendRefs:
        - name: argo-workflows-server
          port: 2746
