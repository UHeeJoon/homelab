# monitoring/prometheus-values.yaml
prometheus:
    prometheusSpec:
        retention: 7d
        resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 2,    memory: 2Gi }
        storageSpec:
            volumeClaimTemplate:
                spec:
                    storageClassName: longhorn-prod
                    resources:
                        requests:
                            storage: 5Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        # PodMonitor 도 전부 줍기
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}

grafana:
    admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
    persistence:
        enabled: true
        storageClassName: longhorn-prod
        size: 1Gi
    # RWO PVC + RollingUpdate → 새/옛 파드가 동시에 PVC 마운트 시도 → Multi-Attach error.
    # Recreate: 옛 파드 종료(PVC 해제) 후 새 파드 생성 → 충돌 없음 (단일 replica라 무중단 불필요).
    deploymentStrategy:
        type: Recreate
    # Explore/대시보드 쿼리 시 512Mi 로는 OOMKilled(exit137) → 상향. idle 360Mi 기준 여유 확보.
    resources:
        requests: { cpu: 250m, memory: 512Mi }
        limits:   { cpu: 1,    memory: 1Gi }
    # LGTM 데이터소스 — Grafana 한 곳에서 메트릭(Prom)+로그(Loki)+트레이스(Tempo)
    additionalDataSources:
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
        - name: Tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200

alertmanager:
    # ── 플랫폼 알림 → Slack (11-27) ──
    # warning·critical 을 Slack 채널에 그대로 올린다 (AI 조사 없음).
    # kube_chatops="true" 알림은 테넌트(demo)의 AlertmanagerConfig 가 n8n → 에이전트 조사로 보내므로 여기서는 뺀다 (중복 방지).
    # 봇 토큰: ExternalSecret alertmanager-slack (components/secrets/monitoring) → 아래 secrets 로 파일 마운트.
    config:
        route:
            receiver: "null"
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
                - receiver: "null"
                  matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
                - receiver: slack-platform
                  matchers: ['severity =~ "warning|critical"', 'kube_chatops != "true"']
        receivers:
            - name: "null"
            - name: slack-platform
              slack_configs:
                  - api_url: https://slack.com/api/chat.postMessage
                    channel: C0CLECWG67R # kube-chatops 알림 채널 (봇이 들어가 있는 채널이어야 함)
                    send_resolved: true
                    http_config:
                        authorization:
                            credentials_file: /etc/alertmanager/secrets/alertmanager-slack/bot_token
                    color: '{{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}'
                    title: '{{ if eq .Status "firing" }}[발생]{{ else }}[해소]{{ end }} {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }}{{ with .CommonLabels.namespace }}, {{ . }}{{ end }})'
                    # 제목을 누르면 가는 곳. 기본값은 Alertmanager 자기 주소(클러스터 안에서만 열리는 http://...alertmanager.monitoring:9093)라
                    # Slack 에서 눌러도 열리지 않았다. 밖에서 열리는 Grafana 의 알림 규칙 화면(이 알림 이름으로 검색)으로 보낸다.
                    title_link: 'https://grafana.ascode.click/alerting/list?search={{ .CommonLabels.alertname | urlquery }}'
                    # 알림마다: 요약, 어디서(네임스페이스·파드·노드), 설명, 시작 시각(KST), 대응 문서 링크(기본 규칙에 들어 있는 runbook_url).
                    text: |-
                        {{ range .Alerts }}• *{{ or .Annotations.summary .Labels.alertname }}*{{ with .Labels.namespace }} · `{{ . }}`{{ end }}{{ with .Labels.pod }} · `{{ . }}`{{ end }}{{ with .Labels.node }} · 노드 `{{ . }}`{{ end }}
                        {{ with .Annotations.description }}    {{ reReplaceAll "\\s+" " " . }}
                        {{ end }}    시작 {{ (.StartsAt.Add 32400000000000).Format "01-02 15:04" }} KST{{ with .Annotations.runbook_url }} · <{{ . }}|대응 문서>{{ end }}
                        {{ end }}
    alertmanagerSpec:
        secrets: [alertmanager-slack]
        storage:
            volumeClaimTemplate:
                spec:
                    storageClassName: longhorn-prod
                    resources:
                        requests:
                            storage: 1Gi

# ── 수집하지 않는 대상 (11-27) ──
# 수집이 안 되는데 켜 두면 TargetDown, etcdInsufficientMembers(critical) 같은 거짓 알림만 만든다.
kubeProxy:
    enabled: false # kube-proxy 없음 (Cilium kubeProxyReplacement)
# kubeadm 기본값은 아래 셋을 127.0.0.1 에만 연다 → 다른 파드에서 수집 불가 (연결 거부).
# 켜려면 master 에서 ① /etc/kubernetes/manifests 의 controller-manager·scheduler 에 --bind-address=0.0.0.0,
# etcd 에 --listen-metrics-urls=http://0.0.0.0:2381 ② monitoring-netpol 의 노드 포트에 10257, 10259, 2381 추가 후 true 로.
kubeControllerManager:
    enabled: false
kubeScheduler:
    enabled: false
kubeEtcd:
    enabled: false
defaultRules:
    disabled:
        KubeCPUOvercommit: true # 노드 2대라 "한 대가 죽으면 요청량을 못 받는다" 가 구조상 항상 참
