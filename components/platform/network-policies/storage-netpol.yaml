# netpol/storage-netpol.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-netpol
  namespace: storage
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cicd
    - from:
        - podSelector: {} # storage 내부 replication 허용
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
    # CNPG operator → 인스턴스 status(8000)/metrics 프로브. 없으면 클러스터가
    # NotReady 로 묶여 두 번째 인스턴스가 생성되지 않음
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
    # ECK operator → Elasticsearch 파드(9200) 오케스트레이션/헬스체크
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
  egress:
    - to:
        - podSelector: {} # storage 내부 통신
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# kube-apiserver egress (minio/strimzi 등 operator 의 API 호출)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-netpol
  namespace: storage
spec:
  endpointSelector: {}
  ingress:
    # Gateway 진입 — Cilium Gateway 트래픽은 예약신원 ingress (ns 셀렉터 미매칭)
    - fromEntities: [ingress]
  egress:
    - toEntities: [kube-apiserver]
---
# kube-chatops MLOps (mlops ns) → MinIO 만 허용. 학습 파이프라인, MLflow, KServe 모델 다운로드가 쓴다.
# storage-netpol 처럼 ns 전체를 열면 mongodb, redis 까지 닿으므로 MinIO 파드만 고른다.
# MinIO 쪽 권한은 버킷 mlops 하나로 묶인 전용 사용자 (components/data/minio-provision).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-from-mlops
  namespace: storage
spec:
  podSelector:
    matchLabels: { v1.min.io/tenant: myminio }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mlops }
      ports:
        - { port: 9000, protocol: TCP }
