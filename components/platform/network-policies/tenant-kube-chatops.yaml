# components/platform/network-policies/tenant-kube-chatops.yaml
# 테넌트 기준선: 전부 차단 → DNS 와 모니터링 스크레이프만 허용.
# 그 밖의 통신(네임스페이스 내부, 외부 API 등)은 테넌트가 배포 저장소에 NetworkPolicy 로 추가한다.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: aiops
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-baseline
  namespace: aiops
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
