# netpol/monitoring-netpol.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-netpol
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # monitoring 내부 통신 (Grafana→Prometheus, Prometheus→kube-state-metrics/alertmanager 등)
    # 없으면 같은 ns여도 ingress가 막혀 타임아웃 (egress엔 podSelector{} 있지만 ingress엔 없었음)
    - from:
        - podSelector: {}
    # ECK operator → Kibana 파드 관리/헬스체크
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
    - to:
        - podSelector: {} # monitoring 내부 통신
    # 테넌트 네임스페이스 (메트릭 스크레이프, Alertmanager → n8n webhook)
    - to:
        - namespaceSelector:
            matchExpressions:
              - { key: tenant, operator: Exists }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443 # 외부 알림 (Slack, PagerDuty 등)
        - port: 80
---
# 노드 스크레이프(kubelet/cAdvisor 10250, node-exporter 9100) + kube-apiserver(SD/operator)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-netpol
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    # Gateway 진입 — Cilium Gateway 트래픽은 예약신원 ingress (ns 셀렉터 미매칭)
    - fromEntities: [ingress]
  egress:
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "9100", protocol: TCP }
    - toEntities: [kube-apiserver]
