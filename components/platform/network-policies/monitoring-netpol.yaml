# netpol/monitoring-netpol.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-netpol
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # monitoring 내부 통신 (Grafana→Prometheus, Prometheus→kube-state-metrics/alertmanager 등)
    # 없으면 같은 ns여도 ingress가 막혀 타임아웃 (egress엔 podSelector{} 있지만 ingress엔 없었음)
    - from:
        - podSelector: {}
    # ECK operator → Kibana 파드 관리/헬스체크
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
    - to:
        - podSelector: {} # monitoring 내부 통신
    # 테넌트 네임스페이스 (메트릭 스크레이프, Alertmanager → n8n webhook)
    - to:
        - namespaceSelector:
            matchExpressions:
              - { key: tenant, operator: Exists }
    # 플랫폼 구성 요소의 지표 포트. 여기 없으면 수집이 시간 초과로 실패하고 TargetDown 이 계속 뜬다
    # (11-27 Hubble 흐름 지표의 정책 차단으로 발견: coredns, argo workflow-controller, cert-manager 3종).
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { port: 9153, protocol: TCP } # coredns
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: argo }
      ports:
        - { port: 9090, protocol: TCP } # workflow-controller
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cert-manager }
      ports:
        - { port: 9402, protocol: TCP } # controller, cainjector, webhook
    # keycloak 관리 포트(9000, /metrics). 차트에서 metrics 를 켰는데 이 허용이 없어 수집이 시간 초과로 계속 실패했다 (11-27 발견).
    # 로그인 실패 수(무차별 대입) 같은 지표를 여기서 본다.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - port: 9000
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443 # 외부 알림 (Slack, PagerDuty 등)
        - port: 80
---
# 노드 스크레이프(kubelet/cAdvisor 10250, node-exporter 9100, Tetragon 2112, Hubble 9965) + kube-apiserver(SD/operator)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cilium-netpol
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    # Gateway 진입 — Cilium Gateway 트래픽은 예약신원 ingress (ns 셀렉터 미매칭)
    - fromEntities: [ingress]
  egress:
    - toEntities: [host, remote-node]
      toPorts:
        - ports:
            - { port: "10250", protocol: TCP }
            - { port: "9100", protocol: TCP }
            - { port: "2112", protocol: TCP } # Tetragon (hostNetwork)
            - { port: "9965", protocol: TCP } # Hubble 흐름 지표 (cilium-agent, hostNetwork)
    - toEntities: [kube-apiserver]
---
# kube-chatops 테넌트 → 관측 스택 (2026-11-26)
# mcp ns 의 MCP 서버가 Prometheus(9090), Loki(3100) 를 조회하고, aiops ns 의 agent 가 Tempo 로 트레이스(OTLP 4317/4318)를 보낸다.
# mlops ns 의 학습 파이프라인은 Prometheus(9090)만 읽는다.
# 포트는 목적지 파드 기준이라 각 ns 는 해당 포트를 여는 파드에만 닿는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-kube-chatops-ingress
  namespace: monitoring
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [prometheus, loki, tempo] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mcp }
      ports:
        - { port: 9090, protocol: TCP }
        - { port: 3100, protocol: TCP }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: aiops }
      ports:
        - { port: 4317, protocol: TCP }
        - { port: 4318, protocol: TCP }
    # mlops ns 의 학습 파이프라인(extract 단계)이 Prometheus 에서 학습 데이터를 읽는다 (2026-11-26)
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: mlops }
      ports:
        - { port: 9090, protocol: TCP }
