# components/platform/namespaces/kube-chatops.yaml
# 테넌트 kube-chatops 네임스페이스 (배포 저장소: GitHub UHeeJoon/kube-chatops-deploy)
# - 라벨 tenant: 플랫폼 netpol(모니터링 스크레이프 등)이 테넌트 네임스페이스를 고르는 기준
# - PSA: baseline 강제, restricted 경고
# - LimitRange 기본값과 ResourceQuota 는 플랫폼이 정한다 (테넌트는 만들 수 없음)
---
apiVersion: v1
kind: Namespace
metadata:
  name: aiops
  labels:
    tenant: kube-chatops
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: aiops
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 64Mi }
      default: { memory: 512Mi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: aiops
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 8Gi
    persistentvolumeclaims: "5"
    requests.storage: 30Gi
    services.loadbalancer: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
  labels:
    tenant: kube-chatops
