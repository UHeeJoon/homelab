# MinIO 버킷·사용자·정책을 선언형으로 맞춘다 (Argo CD sync 때마다 다시 실행, 여러 번 돌아도 결과 같음).
# - 버킷 mlops: kube-chatops MLOps 데이터(data/), MLflow 아티팩트(mlflow/)
# - 사용자: Vault secret/kube-chatops/mlops 의 access key, 정책 mlops-rw (버킷 mlops 만 읽고 쓰기)
# 이미지는 테넌트와 같은 MinIO 서버 이미지 (mc 가 들어 있고 노드에 이미 받아져 있다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: minio-provision
  namespace: storage
data:
  mlops-rw.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
          "Resource": ["arn:aws:s3:::mlops"]
        },
        {
          "Effect": "Allow",
          "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"],
          "Resource": ["arn:aws:s3:::mlops/*"]
        }
      ]
    }
  provision.sh: |
    set -eu
    . /root-config/config.env
    mc alias set local http://minio.storage.svc.cluster.local "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /dev/null
    mc mb --ignore-existing local/mlops
    mc admin policy create local mlops-rw /provision/mlops-rw.json
    mc admin user add local "$MLOPS_ACCESS_KEY" "$MLOPS_SECRET_KEY" > /dev/null
    # 이미 붙어 있으면 오류를 내므로 결과는 아래에서 따로 확인한다
    mc admin policy attach local mlops-rw --user "$MLOPS_ACCESS_KEY" > /dev/null 2>&1 || true
    # 이미지에 grep 이 없어 셸 패턴으로 확인한다
    info=$(mc admin user info local "$MLOPS_ACCESS_KEY" --json)
    case "$info" in
      *'"policyName"'*mlops-rw*) ;;
      *) echo "정책 mlops-rw 가 사용자에 붙지 않았다"; exit 1 ;;
    esac
    echo "완료: 버킷 mlops, 사용자 $MLOPS_ACCESS_KEY, 정책 mlops-rw"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-provision
  namespace: storage
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mc
          image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z
          command: [sh, /provision/provision.sh]
          env:
            - { name: MC_CONFIG_DIR, value: /tmp/mc }
            - { name: HOME, value: /tmp }
          envFrom:
            - secretRef: { name: mlops-minio-user }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: provision, mountPath: /provision }
            - { name: root-config, mountPath: /root-config }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: provision
          configMap: { name: minio-provision }
        - name: root-config
          secret: { secretName: myminio-env-configuration }
        - name: tmp
          emptyDir: {}
