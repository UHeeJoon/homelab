# storage/mlops-minio-user.yaml
# kube-chatops MLOps 전용 MinIO 사용자 (Vault secret/kube-chatops/mlops).
# minio-provision Job 이 이 값으로 사용자를 만들고, mlops ns 는 같은 Vault 값을 자기 SecretStore 로 읽는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlops-minio-user
  namespace: storage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mlops-minio-user
    creationPolicy: Owner
  data:
    - secretKey: MLOPS_ACCESS_KEY
      remoteRef: { key: kube-chatops/mlops, property: minio_access_key }
    - secretKey: MLOPS_SECRET_KEY
      remoteRef: { key: kube-chatops/mlops, property: minio_secret_key }
