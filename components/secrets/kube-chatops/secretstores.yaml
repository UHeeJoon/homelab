# components/secrets/kube-chatops/secretstores.yaml
# 테넌트 kube-chatops 전용 SecretStore — 네임스페이스마다 하나, 이름은 vault.
# Vault role kube-chatops 는 secret/kube-chatops/* 읽기만 허용한다 (설정: langGraph/docs 런북 참고).
# 테넌트는 ClusterSecretStore vault-backend 를 쓸 수 없다 (vault-backend 의 conditions).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-vault
  namespace: aiops
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: aiops
spec:
  provider:
    vault:
      server: "http://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "kube-chatops"
          serviceAccountRef:
            name: eso-vault
