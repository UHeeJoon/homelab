# Vault 전체(secret/*)를 읽을 수 있는 플랫폼용 저장소. 쓸 수 있는 네임스페이스를 제한한다.
# 테넌트 kube-chatops 는 자기 네임스페이스의 SecretStore vault 를 쓴다.
# frontend 는 sapari 테넌트지만 아직 이 저장소를 쓴다 (전용 SecretStore 로 옮기면 목록에서 뺀다).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  conditions:
    - namespaces: [cicd, keycloak, monitoring, storage, frontend]
  provider:
    vault:
      server: "http://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
