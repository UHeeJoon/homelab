# components/secrets/cicd/repo-oci-kserve.yaml
# Argo CD 저장소 등록: KServe Helm 차트 (OCI, 공개 → 자격 없음).
# Helm OCI 저장소는 등록하면서 enableOCI 를 켜야 chart 로 읽을 수 있다.
apiVersion: v1
kind: Secret
metadata:
  name: repo-oci-kserve
  namespace: cicd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: kserve-charts (oci)
  url: ghcr.io/kserve/charts
  enableOCI: "true"
