# components/secrets/cicd/gitlab-repo-externalsecret.yaml
# Argo CD 저장소 등록: GitLab 애플리케이션 저장소 (비공개 → 자격 필요, Vault → ESO).
# Vault secret/cicd/gitlab 에 username + token (Deploy Token, read_repository).
# 플랫폼 저장소(GitHub homelab)는 repo-github-homelab.yaml 참고.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-repo
  namespace: cicd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitlab-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        name: sapari-helm-manifest (apps)
        url: https://gitlab.com/sagopanda/sapari-helm-manifest.git
        username: "{{ .username }}"
        password: "{{ .token }}"
  data:
    - secretKey: username
      remoteRef: { key: cicd/gitlab, property: username }
    - secretKey: token
      remoteRef: { key: cicd/gitlab, property: token }
