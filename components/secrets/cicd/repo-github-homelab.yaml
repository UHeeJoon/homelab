# components/secrets/cicd/repo-github-homelab.yaml
# Argo CD 저장소 등록: GitHub 플랫폼 저장소 (공개 → 자격 없음).
# 등록하지 않아도 읽을 수는 있지만, 등록해 두면 Settings > Repositories 에서 연결 상태를 볼 수 있다.
# 비공개로 바꿀 때는 이 파일을 Vault 의 읽기 전용 Deploy Key 를 쓰는 ExternalSecret 으로 교체한다.
apiVersion: v1
kind: Secret
metadata:
  name: repo-github-homelab
  namespace: cicd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  name: homelab (platform)
  url: https://github.com/UHeeJoon/homelab.git
