# Alertmanager → Slack (플랫폼 알림, 11-27). Slack 봇 토큰을 Alertmanager 가 파일로 읽는다.
# 토큰은 kube-chatops 봇과 같은 것(Vault secret/kube-chatops/slack, 사람이 넣음)을 쓴다. 봇이 이미 알림 채널에 들어가 있어서다.
# 플랫폼 전용 봇·채널로 나누려면 Vault 에 새 경로를 만들고 아래 key 만 바꾼다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault-backend }
  target: { name: alertmanager-slack, creationPolicy: Owner }
  data:
    - secretKey: bot_token
      remoteRef: { key: kube-chatops/slack, property: bot_token }
