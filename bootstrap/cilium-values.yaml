# bootstrap/cilium-values.yaml — Cilium CNI (bootstrap 레이어: helm 직접 설치)
#   CNI 는 ArgoCD 로 관리하지 않는다(네트워크 죽으면 ArgoCD 도 죽는 닭-달걀) —
#   argocd-values.yaml 과 같은 bootstrap 계층. Cilium "정책" CRD 들만 GitOps 로 관리.
#
#   적용:
#     helm repo add cilium https://helm.cilium.io
#     helm upgrade --install cilium cilium/cilium --version 1.19.4 \
#       -n kube-system -f bootstrap/cilium-values.yaml

# ── 데이터패스: VXLAN 터널 (실제 설치 상태, 11-27 파일을 맞춤) ──
#   노드 2대가 직결선(eno1, 10.10.10.0/30)으로 같은 L2 라서 native routing 이 더 낫다 (캡슐화 없음, MTU 1500).
#   전환은 노드 간 통신이 끊기는 작업이라 runbook 으로 따로 한다: langGraph docs/cilium-native-routing-runbook.md
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]
    clusterPoolIPv4MaskSize: 24
routingMode: tunnel
tunnelProtocol: vxlan
autoDirectNodeRoutes: false
ipv4NativeRoutingCIDR: "10.244.0.0/16" # 터널에서도 설치 때부터 있던 값 (이 대역은 SNAT 안 함). native 전환 때 그대로 쓴다
MTU: 1350 # 설치 때 지정된 값 (출처 기록 없음). 바꾸면 새 파드부터 적용 → native 전환 때 1500 으로
enableIPv4Masquerade: true
bpf:
  masquerade: true

# ── CNI: Cilium 단독 ──
cni:
  customConf: false
  uninstall: false # agent 재시작/업그레이드 때 CNI conf 보존
  exclusive: true
operator:
  replicas: 1 # 2노드 홈랩
  unmanagedPodWatcher:
    restart: true
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}

# ── kube-proxy replacement — kube-proxy 가 없으므로 apiserver 직접 지정 필수 ──
kubeProxyReplacement: true
k8sServiceHost: 10.10.10.1   # master 직결선(eno1) 주소. 11-26 부터 노드 간 통신은 직결선
k8sServicePort: 6443

# ── LB-IPAM + L2 announcement — 풀/정책은 components/networking/lb-ipam (GitOps) ──
l2announcements:
  enabled: true
externalIPs:
  enabled: true

# ── Gateway API — 사전 설치된 Gateway API CRD bundle 이 Cilium 지원 버전과 일치해야 함 ──
gatewayAPI:
  enabled: true

# ── 관측 (Hubble — netpol drop 디버깅에 바로 사용) ──
hubble:
  enabled: true
  # 흐름 지표 (11-27, 보안 S-9): 횡이동·외부 연결·포트 스캔·정책 차단을 Prometheus 로.
  # 라벨은 namespace/workload 단위로만 (파드·IP 단위는 시계열이 폭증). 외부 목적지는 DNS 이름(없으면 IP).
  metrics:
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
    enabled:
      - dns:query;ignoreAAAA
      - drop:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - flow:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - tcp:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload
      - port-distribution:labelsContext=source_namespace,destination_namespace
      - icmp
      - flows-to-world:sourceContext=namespace;destinationContext=dns|ip;port;any-drop
      - httpV2:exemplars=true;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
  relay:
    enabled: true
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
  ui:
    enabled: true # hubble.ascode.click (admin-gateway HTTPRoute)
    frontend:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
    backend:
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 256Mi}

# cilium-agent (노드당 1)
resources:
  requests: {cpu: 50m, memory: 256Mi}
  limits: {memory: 768Mi}

# FQDN(toFQDNs) 정책은 별도 스위치 불필요 — CiliumNetworkPolicy 에서 쓰면 DNS 프록시 자동.
