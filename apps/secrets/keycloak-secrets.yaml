# Keycloak admin/DB 자격(ExternalSecret) 배포 — root-app(recurse)이 직접 적용.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-secrets
  namespace: cicd
  annotations:
    # API 서버가 채우는 기본값(ExternalSecret 전략 필드)을 차이로 보지 않게 한다
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels: { category: secrets }
spec:
  project: secrets
  source:
    repoURL: https://github.com/UHeeJoon/homelab.git
    targetRevision: release
    path: components/secrets/keycloak # 이 폴더의 매니페스트를 그대로 적용
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
