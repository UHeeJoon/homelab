# apps/secrets/monitoring-secrets.yaml — [매니페스트형 leaf] git 디렉토리 적용
# Grafana admin / Loki·Tempo MinIO 자격 (ExternalSecret)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: cicd
  annotations:
    # API 서버가 채우는 기본값(ExternalSecret 전략 필드)을 차이로 보지 않게 한다
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels: { category: secrets }
spec:
  project: secrets
  source:
    repoURL: https://github.com/UHeeJoon/homelab.git
    targetRevision: release
    path: components/secrets/monitoring
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring # 매니페스트에 ns 가 있으면 그쪽으로
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
