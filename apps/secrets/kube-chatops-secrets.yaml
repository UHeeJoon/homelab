# apps/secrets/kube-chatops-secrets.yaml — [매니페스트형 leaf] git 디렉토리 적용
# 테넌트 kube-chatops 의 SecretStore (네임스페이스별)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-chatops-secrets
  namespace: cicd
  labels: { category: secrets }
spec:
  project: secrets
  source:
    repoURL: https://github.com/UHeeJoon/homelab.git
    targetRevision: release
    path: components/secrets/kube-chatops
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops # 매니페스트에 ns 가 있으면 그쪽으로
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
