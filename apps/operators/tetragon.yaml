# apps/operators/tetragon.yaml — [Helm형 leaf]
# Tetragon: eBPF 런타임 보안 (프로세스 실행, 파일, 연결을 커널에서 본다). Cilium 과 같은 팀, 같은 차트 저장소.
# 정책(TracingPolicy)은 따로 둔다: 클러스터 전체 기록용(웹셸, 투하 실행, 권한 상승, 파일 변조, 메모리 조작)은 components/operators/tetragon-policies,
# 차단(Sigkill)은 테넌트가 자기 ns 에 TracingPolicyNamespaced 로 (kube-chatops-deploy demo/security).
# 이벤트: JSON → export-stdout 컨테이너 → Alloy → Loki ({namespace="kube-system", container="export-stdout"})
# 지표: tetragon_policy_events_total{policy, namespace(대상 파드), pod, binary} → Prometheus (honorLabels)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon
  namespace: cicd
  labels: { category: operators }
spec:
  project: operators
  source:
    repoURL: https://helm.cilium.io
    chart: tetragon
    targetRevision: 1.8.0
    helm:
      valuesObject:
        tetragon:
          # 감사 정책 4개 + demo 차단 4개를 올린 뒤 530~605Mi (11-27). 768Mi 로는 여유가 없어 1Gi 로 올렸다.
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 1Gi } }
          # 쓰기 거부(Override)를 쓰려면 kprobe_multi 를 꺼야 한다. 이 커널(el10 6.12)은 bpf_override_return 이 없어
          # Tetragon 이 fmod_ret 로 대신하는데, kprobe_multi 로 붙인 함수는 Override 가 거부된다.
          # BPF LSM 훅(lsmhooks)은 Tetragon 1.8 의 프로그램이 이 커널 검증기 한도를 넘어 로드되지 않는다 (11-27 확인).
          extraArgs:
            disable-kprobe-multi: "true"
          # Loki 로 보내는 양을 줄인다: 정책에 걸린 이벤트는 전부, 실행 기록은 demo 만 (조사 근거용).
          # 기본값은 모든 ns 의 모든 실행·종료를 내보내 로그가 크게 는다.
          exportAllowList: |-
            {"event_set":["PROCESS_KPROBE","PROCESS_TRACEPOINT","PROCESS_LSM","PROCESS_UPROBE"]}
            {"event_set":["PROCESS_EXEC"],"namespace":["demo"]}
          # 정책에 걸린 이벤트는 kube-system·cilium 파드 것도 Loki 로 보낸다 (차트 기본값은 둘 다 버린다).
          # 감사 정책을 클러스터 전체로 넓히면서 열었다 (11-27). 노드 프로세스(namespace 빈 값)는 계속 버린다: 지표로는 보인다.
          exportDenyList: |-
            {"health_check":true}
            {"namespace":[""]}
          prometheus:
            serviceMonitor: { enabled: true, scrapeInterval: 15s } # 차단 → Slack 보고를 1분 안으로 (60s 면 수집만 최대 1분)
        export:
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
        tetragonOperator:
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
