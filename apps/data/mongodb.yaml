# apps/data/mongodb.yaml — [Helm형 leaf] 차트=helm repo, values=git(멀티소스)
# MongoDB replicaset (bitnami). existingSecret=mongodb-root(ESO)
# values 한 줄만 고쳐 push 해도 ref:values 소스가 새 커밋으로 추적 → 자동 재렌더·sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: cicd
  annotations:
    # StatefulSet volumeClaimTemplates 등 API 서버 기본값을 차이로 보지 않게 한다
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  labels: { category: data }
spec:
  project: data
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: mongodb
      targetRevision: 19.0.3
      helm:
        valueFiles:
          - $values/components/data/mongodb/values.yaml
    - repoURL: https://github.com/UHeeJoon/homelab.git
      targetRevision: release
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
