# apps/data/kafka.yaml — [매니페스트형 leaf] git 디렉토리 적용
# Strimzi Kafka(KRaft) + KafkaNodePool + KafkaUser
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: cicd
  labels: { category: data }
spec:
  project: data
  source:
    repoURL: https://github.com/UHeeJoon/homelab.git
    targetRevision: release
    path: components/data/kafka
    directory:
      recurse: true
      # 중지: Kafka 리소스를 클러스터에서 뺀다 (PVC 는 deleteClaim: false 로 유지). 다시 켤 때 이 줄 삭제
      exclude: strimzi-kafka.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: storage # 매니페스트에 ns 가 있으면 그쪽으로
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ ServerSideApply=true ]
